name: Postman API Tests

on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main]

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection
        run: |
          newman run "Postman/enterprise-inventory-api.postman_collection" \
            --environment "Postman/Inventory.postman_environment.json" \
            --reporters cli
